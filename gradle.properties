# Set maximum memory for Gradle builds (4 GB)
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Use AndroidX libraries instead of old support libraries
android.useAndroidX=true

# Follow official Kotlin code style
kotlin.code.style=official

# Prevent duplicate R files, makes builds faster
android.nonTransitiveRClass=true

# Enable faster incremental builds for Kotlin and Compose
kotlin.incremental=true
